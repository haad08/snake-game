<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0D1117;
    --panel: #131A22;
    --grid-line: #1C2530;
    --snake: #39FF6A;
    --snake-head: #B6FFCB;
    --food: #FF5D5D;
    --text: #E6EDF3;
    --muted: #6E7B8A;
    --accent: #39FF6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 22px;
    color: var(--accent);
    margin: 0;
    text-shadow: 0 0 12px rgba(57,255,106,0.5);
    letter-spacing: 2px;
  }
  .hud {
    display: flex; gap: 24px; align-items: center;
    font-size: 14px; color: var(--muted);
  }
  .hud .value { color: var(--text); font-weight: 700; }
  .board-wrap { position: relative; }
  canvas {
    background: var(--panel);
    border: 2px solid var(--grid-line);
    box-shadow: 0 0 0 4px var(--bg), 0 0 24px rgba(57,255,106,0.15);
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute; inset: 0;
    background: rgba(13,17,23,0.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px; color: var(--food); margin: 0;
  }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; }
  button {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: var(--accent);
    color: #0D1117;
    border: none;
    padding: 12px 18px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:active { transform: translateY(1px); }
  .controls-hint { color: var(--muted); font-size: 12px; text-align: center; }
  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(2, 48px);
    gap: 6px;
    margin-top: 4px;
  }
  .touch-controls button {
    padding: 0; font-size: 16px; background: var(--panel); color: var(--accent);
    border: 1px solid var(--grid-line);
  }
  @media (pointer: coarse) {
    .touch-controls { display: grid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>SNAKE</h1>
  <div class="hud">
    <div>SCORE <span class="value" id="score">0</span></div>
    <div>BEST <span class="value" id="best">0</span></div>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">READY?</h2>
      <p id="overlaySub">Use arrow keys or WASD to move</p>
      <button id="startBtn">START</button>
    </div>
  </div>
  <p class="controls-hint">Arrow keys / WASD to move &middot; Space to pause</p>
  <div class="touch-controls">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
</div>

<script>
  const CELL = 20;
  const COLS = 20;
  const ROWS = 20;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlaySub = document.getElementById("overlaySub");
  const startBtn = document.getElementById("startBtn");

  let snake, dir, nextDir, food, score, best, running, paused, tickMs, loopId;

  best = 0; // in-memory only, resets on page reload

  function resetGame() {
    snake = [
      { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 130;
    placeFood();
    updateHud();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some((s) => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
    }

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2.6, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake');
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function step() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some((s) => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) best = score;
      updateHud();
      placeFood();
      if (tickMs > 60) tickMs -= 3;
      restartLoop();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartLoop() {
    clearInterval(loopId);
    loopId = setInterval(step, tickMs);
  }

  function startGame() {
    resetGame();
    running = true;
    paused = false;
    overlay.classList.add("hidden");
    draw();
    restartLoop();
  }

  function gameOver() {
    running = false;
    clearInterval(loopId);
    overlayTitle.textContent = "GAME OVER";
    overlaySub.textContent = `Score: ${score} — press start to try again`;
    startBtn.textContent = "RETRY";
    overlay.classList.remove("hidden");
  }

  function setDirection(nx, ny) {
    // prevent reversing directly into itself
    if (snake.length > 1 && nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener("keydown", (e) => {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": setDirection(0, -1); break;
      case "ArrowDown": case "s": case "S": setDirection(0, 1); break;
      case "ArrowLeft": case "a": case "A": setDirection(-1, 0); break;
      case "ArrowRight": case "d": case "D": setDirection(1, 0); break;
      case " ":
        if (running) { paused = !paused; }
        break;
    }
  });

  document.querySelectorAll(".touch-controls button").forEach((btn) => {
    btn.addEventListener("click", () => {
      const d = btn.dataset.dir;
      if (d === "up") setDirection(0, -1);
      if (d === "down") setDirection(0, 1);
      if (d === "left") setDirection(-1, 0);
      if (d === "right") setDirection(1, 0);
    });
  });

  startBtn.addEventListener("click", startGame);

  resetGame();
  draw();
</script>
</body>
</html>
